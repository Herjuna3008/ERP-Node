version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: erp-node-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-erp_node}
      MYSQL_USER: ${MYSQL_USER:-erp_node}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-erp_node_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-erp_node_root_password}
      TZ: ${MYSQL_TZ:-UTC}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql-data:
    driver: local
